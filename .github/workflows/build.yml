name: Build

# Builds master and every pull request once, so a change that doesn't compile shows up before a release.
# A branch without a pull request builds from the Actions tab (Run workflow).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Build
        run: ./build.sh dev
